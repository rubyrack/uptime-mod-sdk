[package]
name = "example-autoscaler"
version = "1.0.0"
edition = "2021"
license = "MIT"
publish = false
description = "The com.uptime.example-autoscaler script mod: accepts prospects, buys stock when capacity runs low."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
uptime-mod = { path = "../../rust/uptime-mod" }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
rmp-serde = "1.3.1"

[dev-dependencies]
serde_json = "1"
uptime-mod = { path = "../../rust/uptime-mod", features = ["testing"] }

[workspace]
