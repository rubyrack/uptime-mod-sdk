[package]
name = "uptime-mod"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
# The one crate in mod-sdk that goes to crates.io. Its version
# follows the mod API: mod-sdk/docs/RUST.md#versions.
publish = ["crates-io"]
description = "Guest SDK for Uptime script mods: the Mod trait, typed snapshot and commands, a seeded Rng."
repository = "https://github.com/rubyrack/uptime-mod-sdk"
documentation = "https://rubyrack.github.io/uptime-mod-sdk/"
readme = "README.md"
keywords = ["uptime", "mod", "wasm", "component-model", "gamedev"]
categories = ["game-development", "wasm", "api-bindings"]
include = ["/src/**", "/wit/**", "/README.md", "/LICENSE"]

[features]
# Host-side test helpers (`uptime_mod::testing`). Never part of a mod build.
testing = ["dep:serde_json"]

[dependencies]
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
rmp-serde = "1.3.1"
wit-bindgen = { version = "0.63.0", default-features = false, features = ["macros", "realloc"] }
serde_json = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1"
uptime-mod = { path = ".", features = ["testing"] }
